name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - id: co
        uses: actions/checkout@v4
      - id: unz
        run: unzip -q *.zip
      - id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - id: sdk
        name: Android-Lizenzen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - id: bau
        name: Bauen
        working-directory: Liederraten
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '```'
            echo "checkout=${{ steps.co.outcome }} unzip=${{ steps.unz.outcome }} java=${{ steps.jdk.outcome }} sdk=${{ steps.sdk.outcome }} bauen=${{ steps.bau.outcome }}"
            echo "ANDROID_HOME=$ANDROID_HOME"
            if [ -f build.log ]; then grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A4 build.log | head -60; fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: liederraten-apk
          path: Liederraten/app/build/outputs/apk/debug/app-debug.apk
